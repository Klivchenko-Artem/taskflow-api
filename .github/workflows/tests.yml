name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ставим PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, zip, intl, bcmath, pcntl
          coverage: none

      - name: Кешируем зависимости composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Ставим зависимости
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Готовим окружение
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Прогоняем тесты
        run: php artisan test

      - name: Проверяем, что документация собирается
        run: php artisan l5-swagger:generate
